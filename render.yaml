# Blueprint do Render: https://render.com/docs/blueprint-spec
#
# Por padrao usa o plano free: o banco SQLite e recriado com os dados demo
# (SEED_DEMO=true) a cada deploy/restart. Perfeito para uma demo publica.
#
# Para persistir os dados entre deploys (plano pago), troque plan: free por
# plan: starter e descomente o bloco `disk`.
services:
  - type: web
    name: devtrack
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "true"
    # disk:
    #   name: devtrack-data
    #   mountPath: /opt/render/project/src/server/data
    #   sizeGB: 1
